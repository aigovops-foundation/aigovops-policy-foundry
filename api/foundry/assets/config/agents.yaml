# Governed Policy Foundry -- agent role boundary manifest (source of truth)
# Every agent is a distinct identity with its own Devin service user (where Devin is used),
# its own Beacon policy (OVERT MULTI-1.1), and a capability scope that delegation may only
# narrow, never widen (OVERT IDENT-1.3). The Rego gate in policy/role_boundaries.rego enforces this file.
#
# Placeholders: <ORG_ID>, <ACCOUNT>, repo names. Values in ALL_CAPS are filled at deploy time.

schema: foundry.agents/v0.1
tenant: acme-mfg            # placeholder manufacturer tenant
topology_version: 1         # bump + attest on any change (OVERT MULTI-2.1 / MULTI-2.2)

runtime_limits:
  max_iterations_per_request: 4      # writer<->verifier<->auditor loops before escalation
  max_recursion_depth: 3             # OVERT TOOL-3.4
  identical_call_repeat_limit: 3     # OVERT TOOL-3.4
  circuit_breaker_violation_rate_bp: 500   # 5.00% denials per epoch -> halt (basis points, no floats)
  approval_timeout_minutes: 2880     # 48h; timeout attested as denial (OVERT TOOL-4.3)
  reviewer_max_approvals_per_minute: 2     # OVERT TOOL-4.4 fatigue cap

agents:
  manager:
    runtime: customer-vpc            # NOT a Devin session; runs in governance VPC (Step Functions + Bedrock)
    model_route: bedrock-privatelink
    devin_service_user: svc-foundry-manager
    devin_permissions: [UseDevinSessions, ViewOrgSessions, ManageOrgSessions]   # no ImpersonateOrgSessions
    may_delegate_to: [policy_writer, test_verifier, compliance_auditor]
    capabilities:
      - devin.session.create
      - devin.session.message
      - devin.session.read
      - devin.session.terminate
      - beacon.receipt.emit
      - ticket.update
      - human.approval.request
    forbidden:
      - git.push
      - git.merge
      - policy.approve
      - artifact.sign
      - secret.read
    repos: []

  policy_writer:
    runtime: devin-dedicated
    devin_service_user: null         # sessions created BY the manager's service user; identity = session tags + playbook
    devin_playbook: pb-foundry-policy-writer
    devin_security_profile: sp-foundry-writer
    devin_mode: normal
    max_acu_limit: 40
    capabilities:
      - git.read:policy-src
      - git.push:policy-src/branches/foundry/*
      - pr.open:policy-src
      - opa.test.local
      - artifactory.read
    forbidden:
      - git.merge
      - git.push:policy-src/main
      - git.push:policy-tests/**
      - policy.approve
      - artifact.sign
      - network.ot_zone
    repos: [acme-mfg/policy-src]
    secret_ids: [sec-ghes-writer-ro-artifactory]

  test_verifier:
    runtime: devin-dedicated
    devin_playbook: pb-foundry-test-verifier
    devin_security_profile: sp-foundry-verifier
    devin_mode: normal
    max_acu_limit: 30
    capabilities:
      - git.read:policy-src
      - git.read:requirements
      - git.push:policy-tests/branches/foundry/*
      - opa.test.local
      - conftest.local
      - ci.results.publish
    forbidden:
      - git.push:policy-src/**
      - git.merge
      - policy.approve
      - artifact.sign
      - network.ot_zone
    repos: [acme-mfg/policy-src, acme-mfg/policy-tests, acme-mfg/requirements]
    secret_ids: [sec-ghes-verifier-ro]

  compliance_auditor:
    runtime: customer-vpc            # independent from the writer: different runtime and model route
    model_route: bedrock-privatelink
    capabilities:
      - git.read:policy-src
      - git.read:policy-tests
      - git.read:requirements
      - git.read:control-library
      - beacon.checklist.evaluate
      - finding.file
      - pr.review.request_changes
    forbidden:
      - git.push
      - git.merge
      - pr.review.approve          # auditor can block, never approve; approval is human-only
      - policy.approve
      - artifact.sign
    repos: []

humans:
  policy_owner:      {idp_group: grp-ai-policy-owners,   may: [policy.approve]}
  second_approver:   {idp_group: grp-ai-governance-board, may: [policy.approve]}
  signing_officer:   {idp_group: grp-evidence-signers,   may: [artifact.sign]}
  risk_officer:      {idp_group: grp-enterprise-risk,    may: [underwriting.release]}

separation_of_duties:
  - rule: requester_cannot_be_sole_approver     # OVERT HITL-4.3
  - rule: two_distinct_approvers_for_policy_publish
  - rule: signer_cannot_be_approver_of_same_change
  - rule: no_agent_holds_approve_or_sign
