[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aigovops-policy-foundry"
version = "0.1.0"
description = "Governed multi-agent policy generation: role-boundary gate, approvals, signed bundles, verification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AiGovOps Foundation contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=43",
  "jsonschema>=4.22",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
foundry-verify = "foundry.verify_bundle:cli"
foundry-demo = "foundry.pipeline:cli"

[tool.hatch.build.targets.wheel]
packages = ["app", "foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
