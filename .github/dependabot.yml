# One grouped PR per ecosystem per interval instead of one PR (and one email) per package:
# 13 Dependabot PRs landed in the 30 days to 2026-10-18, six of them on one morning.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /apps/native/src-tauri
    schedule: { interval: monthly }
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups:
      all:
        patterns: ["*"]
