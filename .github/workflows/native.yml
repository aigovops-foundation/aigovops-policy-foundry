name: native apps

# Builds desktop (Windows, macOS, Linux) and mobile (Android, iOS) apps from apps/native.
# Artifacts are unsigned debug/test builds attached to the workflow run. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only one target (all, desktop, android, ios)"
        default: all
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/native/**", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.platform }})
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native/src-tauri
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - working-directory: apps/native
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/native
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  android:
    name: android (debug APK)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - working-directory: apps/native
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx tauri android init --ci
          npx tauri android build --apk --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-foundry-android-debug
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: ios (simulator build)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - working-directory: apps/native
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            # Tauri needs a team ID to generate the Xcode project. Simulator builds are not
            # provisioned, so a placeholder works for an unsigned CI build. Device and store
            # builds need the Foundation's real team ID in the APPLE_DEVELOPMENT_TEAM secret.
            echo "::notice::APPLE_DEVELOPMENT_TEAM not set: unsigned simulator build with a placeholder team."
            export APPLE_DEVELOPMENT_TEAM=AAAAAAAAAA
          fi
          npx tauri ios init --ci
          npx tauri ios build --target aarch64-sim --debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-foundry-ios-simulator
          path: apps/native/src-tauri/gen/apple/build/arm64-sim/*.app
