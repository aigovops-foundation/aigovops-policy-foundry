name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce, expected vs actual. }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Dashboard (web), Desktop app, Mobile app, API, Gate policy, Evidence / verification, Deployment, Docs]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
  - type: markdown
    attributes: { value: "Security issue? Please email security@aigovops-foundation.com instead of filing here." }
