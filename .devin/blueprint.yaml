runs-on: default
# Git-backed Devin environment blueprint for this repo. Sync it from Settings > Environment > Blueprints.
initialize:
  - name: "Install OPA 1.21.1 (checksum-verified)"
    run: |
      arch=$(uname -m); case "$arch" in x86_64) a=amd64; s=668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031;; aarch64|arm64) a=arm64; s=9a1f3625529c6f01240fe68286dde06aa0b23c5253da700ac48f4d943ff8a4de;; esac
      curl -fsSL -o /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_${a}_static"
      echo "$s  /tmp/opa" | sha256sum -c - && sudo install -m 0755 /tmp/opa /usr/local/bin/opa
  - name: "Install Terraform (for deploy validation)"
    run: |
      curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
      cd /tmp && unzip -o -q tf.zip && sudo install -m 0755 terraform /usr/local/bin/terraform
  - name: "Install Rust and Tauri Linux prerequisites (native apps)"
    run: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
maintenance:
  - name: "Python API dependencies"
    run: python3 -m pip install -e "api[dev]"
  - name: "Dashboard dependencies"
    run: cd web && npm ci --no-audit --no-fund
  - name: "Native shell dependencies"
    run: cd apps/native && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
knowledge:
  - name: read-first
    contents: |
      Read DEVIN.md at the repo root before changing anything. It has the build plan, guardrails,
      and the definition of done. Never weaken the gate policy to make a test pass.
  - name: test
    contents: |
      cd api && pytest -q                                   # 1,102 tests incl. gate parity
      cd api/foundry/assets && opa test policy/ config/agents.yaml -v
      python3 scripts/gen_parity.py --check                 # OPA golden still current
      cd web && npm test
  - name: build
    contents: |
      cd web && npm run build                               # dashboard -> web/dist
      docker build -t policy-foundry .                      # API + dashboard + OPA
      cd apps/native && npx tauri build                     # desktop app for this OS
  - name: dev-server
    contents: |
      cd api && OPA_BIN=$(which opa) FOUNDRY_WEB_DIST=../web/dist uvicorn app.main:app --reload --port 8000
      cd web && npm run dev                                 # http://localhost:5173 (proxies /api to :8000)
      API docs: http://localhost:8000/docs
  - name: personas
    contents: |
      The persona wiki is docs/wiki/README.md. Start there to find the path for each role.

---
runs-on: macos
initialize:
  - name: "Set up Python 3.12 API environment"
    run: |
      /opt/homebrew/bin/python3.12 -m venv api/.venv
      api/.venv/bin/python -m pip install --upgrade pip
  - name: "Install OPA 1.21.1 (official checksum)"
    run: |
      arch=$(uname -m)
      case "$arch" in
        arm64) opa_arch=arm64 ;;
        x86_64) opa_arch=amd64 ;;
        *) echo "Unsupported macOS architecture: $arch" >&2; exit 1 ;;
      esac
      asset="opa_darwin_${opa_arch}_static"
      curl -fsSL -o "/tmp/$asset" "https://github.com/open-policy-agent/opa/releases/download/v1.21.1/$asset"
      curl -fsSL -o "/tmp/$asset.sha256" "https://github.com/open-policy-agent/opa/releases/download/v1.21.1/$asset.sha256"
      (cd /tmp && shasum -a 256 -c "$asset.sha256")
      install -m 0755 "/tmp/$asset" api/.venv/bin/opa
  - name: "Install Terraform with Homebrew"
    run: brew install hashicorp/tap/terraform
  - name: "Install Rust toolchain"
    run: |
      if ! command -v rustup >/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      fi
      . "$HOME/.cargo/env"
      rustup toolchain install stable
maintenance:
  - name: "Python API dependencies"
    run: api/.venv/bin/python -m pip install -e "api[dev]"
  - name: "Dashboard dependencies"
    run: cd web && npm ci --no-audit --no-fund
  - name: "Native shell dependencies"
    run: cd apps/native && npm ci --no-audit --no-fund || npm install --no-audit --no-fund
knowledge:
  - name: read-first
    contents: |
      Read DEVIN.md and docs/wiki/README.md before changing anything. python3 is Python 3.9
      on this macOS image; use /opt/homebrew/bin/python3.12 for the API and tests.
  - name: personas
    contents: |
      The persona wiki is docs/wiki/README.md. Start there to find the path for each role.
  - name: test
    contents: |
      source api/.venv/bin/activate
      cd api && pytest -q
      OPA_BIN=/nonexistent pytest -q
      cd web && npm test
  - name: build
    contents: |
      cd web && npm run build
      cd apps/native && npx tauri build
  - name: dev-server
    contents: |
      source api/.venv/bin/activate
      cd api && OPA_BIN="$VIRTUAL_ENV/bin/opa" FOUNDRY_WEB_DIST=../web/dist uvicorn app.main:app --reload --port 8000
      cd web && npm run dev
      API docs: http://localhost:8000/docs
