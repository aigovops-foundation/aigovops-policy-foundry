# Fly.io (also the backend target Devin uses). From the repo root:
#   fly launch --no-deploy --copy-config --config deploy/fly/fly.toml && fly secrets set FOUNDRY_API_TOKEN=... && fly deploy --config deploy/fly/fly.toml
app = "aigovops-policy-foundry"
primary_region = "sea"

[build]
  dockerfile = "../../Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"

[[vm]]
  memory = "512mb"
  cpus = 1
